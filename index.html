<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, Isaiah.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400..700&display=swap" rel="stylesheet" />
    <style>
      :root { color: #2020fa; font-family: "Comfortaa", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 20rem; min-height: 100vh; margin: 0; background: #fff; }
      main { position: relative; z-index: 1; width: min(100% - 2rem, 76rem); margin: 0 auto; padding: 3.5rem 0; }
      h1 { margin: 0 0 2rem; text-align: center; font-size: clamp(2rem, 5vw, 3.5rem); }
      .periodic-table { overflow-x: auto; padding: .5rem; border: 2px solid #2020fa; border-radius: 1.25rem; background: rgba(255, 255, 255, .94); box-shadow: 0 .5rem 0 rgba(32, 32, 250, .12); }
      .element-grid { display: grid; grid-template-columns: repeat(18, minmax(3rem, 1fr)); grid-template-rows: repeat(10, 3.25rem); gap: .3rem; min-width: 61rem; }
      .element { display: grid; position: relative; place-items: center; min-width: 0; padding: .2rem; border: 1.5px solid #1c1c1c; border-radius: .55rem; background: #fff; color: #1c1c1c; font: inherit; cursor: pointer; transition: transform 160ms ease, background-color 160ms ease, color 160ms ease; }
      .element:hover, .element:focus-visible, .element.is-selected { z-index: 1; border-color: #2020fa; background: #2020fa; color: #fff; outline: none; transform: scale(1.1); }
      .element__number { position: absolute; top: .25rem; left: .3rem; font-size: .52rem; font-weight: 700; }
      .element__symbol { font-size: 1rem; font-weight: 700; }
      .element__name { max-width: 100%; overflow: hidden; font-size: .49rem; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
      .element--lanthanide, .element--actinide { border-style: dashed; }
      .details { min-height: 4.5rem; margin: 1.25rem auto 0; padding: 1rem 1.25rem; border-radius: 1rem; background: #2020fa; color: #fff; text-align: center; box-shadow: 0 .5rem 0 rgba(32, 32, 250, .15); }
      .details p { margin: 0; font-size: clamp(.85rem, 2vw, 1rem); line-height: 1.5; }
      .details strong { font-size: 1.2em; }
      .atom { position: fixed; z-index: 0; width: 13rem; aspect-ratio: 1; opacity: .9; pointer-events: none; }
      .atom--top { top: 5%; left: 4%; } .atom--bottom { right: 4%; bottom: 4%; transform: scale(.72); }
      .nucleus { position: absolute; top: 50%; left: 50%; width: 1.25rem; aspect-ratio: 1; border-radius: 50%; background: #2020fa; transform: translate(-50%, -50%); }
      .orbital { position: absolute; inset: 0; border: 2px solid #1c1c1c; border-radius: 50%; animation: spin 7s linear infinite; }
      .orbital:nth-of-type(2) { animation-direction: reverse; animation-duration: 9s; transform: rotate(60deg) scaleY(.4); }
      .orbital:nth-of-type(3) { animation-duration: 11s; transform: rotate(120deg) scaleY(.4); }
      @keyframes spin { to { rotate: 360deg; } }
      @media (max-width: 42rem) { main { width: min(100% - 1rem, 76rem); padding: 1.5rem 0; } h1 { margin-bottom: 1rem; } .atom { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .orbital { animation: none; } .element { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, Isaiah.</h1>
      <section aria-label="Interactive periodic table">
        <div class="periodic-table"><div class="element-grid" id="element-grid"></div></div>
        <div class="details" id="details" aria-live="polite"><p>Explore the periodic table: select an element to learn more.</p></div>
      </section>
    </main>
    <div class="atom atom--top" aria-hidden="true"><span class="nucleus"></span><span class="orbital"></span><span class="orbital"></span><span class="orbital"></span></div>
    <div class="atom atom--bottom" aria-hidden="true"><span class="nucleus"></span><span class="orbital"></span><span class="orbital"></span><span class="orbital"></span></div>
    <script>
      const elementData = `1|H|Hydrogen|1|1|nonmetal;2|He|Helium|18|1|noble gas;3|Li|Lithium|1|2|alkali metal;4|Be|Beryllium|2|2|alkaline earth metal;5|B|Boron|13|2|metalloid;6|C|Carbon|14|2|nonmetal;7|N|Nitrogen|15|2|nonmetal;8|O|Oxygen|16|2|nonmetal;9|F|Fluorine|17|2|halogen;10|Ne|Neon|18|2|noble gas;11|Na|Sodium|1|3|alkali metal;12|Mg|Magnesium|2|3|alkaline earth metal;13|Al|Aluminium|13|3|post-transition metal;14|Si|Silicon|14|3|metalloid;15|P|Phosphorus|15|3|nonmetal;16|S|Sulfur|16|3|nonmetal;17|Cl|Chlorine|17|3|halogen;18|Ar|Argon|18|3|noble gas;19|K|Potassium|1|4|alkali metal;20|Ca|Calcium|2|4|alkaline earth metal;21|Sc|Scandium|3|4|transition metal;22|Ti|Titanium|4|4|transition metal;23|V|Vanadium|5|4|transition metal;24|Cr|Chromium|6|4|transition metal;25|Mn|Manganese|7|4|transition metal;26|Fe|Iron|8|4|transition metal;27|Co|Cobalt|9|4|transition metal;28|Ni|Nickel|10|4|transition metal;29|Cu|Copper|11|4|transition metal;30|Zn|Zinc|12|4|transition metal;31|Ga|Gallium|13|4|post-transition metal;32|Ge|Germanium|14|4|metalloid;33|As|Arsenic|15|4|metalloid;34|Se|Selenium|16|4|nonmetal;35|Br|Bromine|17|4|halogen;36|Kr|Krypton|18|4|noble gas;37|Rb|Rubidium|1|5|alkali metal;38|Sr|Strontium|2|5|alkaline earth metal;39|Y|Yttrium|3|5|transition metal;40|Zr|Zirconium|4|5|transition metal;41|Nb|Niobium|5|5|transition metal;42|Mo|Molybdenum|6|5|transition metal;43|Tc|Technetium|7|5|transition metal;44|Ru|Ruthenium|8|5|transition metal;45|Rh|Rhodium|9|5|transition metal;46|Pd|Palladium|10|5|transition metal;47|Ag|Silver|11|5|transition metal;48|Cd|Cadmium|12|5|transition metal;49|In|Indium|13|5|post-transition metal;50|Sn|Tin|14|5|post-transition metal;51|Sb|Antimony|15|5|metalloid;52|Te|Tellurium|16|5|metalloid;53|I|Iodine|17|5|halogen;54|Xe|Xenon|18|5|noble gas;55|Cs|Caesium|1|6|alkali metal;56|Ba|Barium|2|6|alkaline earth metal;57|La|Lanthanum|3|6|lanthanide;72|Hf|Hafnium|4|6|transition metal;73|Ta|Tantalum|5|6|transition metal;74|W|Tungsten|6|6|transition metal;75|Re|Rhenium|7|6|transition metal;76|Os|Osmium|8|6|transition metal;77|Ir|Iridium|9|6|transition metal;78|Pt|Platinum|10|6|transition metal;79|Au|Gold|11|6|transition metal;80|Hg|Mercury|12|6|transition metal;81|Tl|Thallium|13|6|post-transition metal;82|Pb|Lead|14|6|post-transition metal;83|Bi|Bismuth|15|6|post-transition metal;84|Po|Polonium|16|6|post-transition metal;85|At|Astatine|17|6|halogen;86|Rn|Radon|18|6|noble gas;87|Fr|Francium|1|7|alkali metal;88|Ra|Radium|2|7|alkaline earth metal;89|Ac|Actinium|3|7|actinide;104|Rf|Rutherfordium|4|7|transition metal;105|Db|Dubnium|5|7|transition metal;106|Sg|Seaborgium|6|7|transition metal;107|Bh|Bohrium|7|7|transition metal;108|Hs|Hassium|8|7|transition metal;109|Mt|Meitnerium|9|7|transition metal;110|Ds|Darmstadtium|10|7|transition metal;111|Rg|Roentgenium|11|7|transition metal;112|Cn|Copernicium|12|7|transition metal;113|Nh|Nihonium|13|7|post-transition metal;114|Fl|Flerovium|14|7|post-transition metal;115|Mc|Moscovium|15|7|post-transition metal;116|Lv|Livermorium|16|7|post-transition metal;117|Ts|Tennessine|17|7|halogen;118|Og|Oganesson|18|7|noble gas;58|Ce|Cerium|4|9|lanthanide;59|Pr|Praseodymium|5|9|lanthanide;60|Nd|Neodymium|6|9|lanthanide;61|Pm|Promethium|7|9|lanthanide;62|Sm|Samarium|8|9|lanthanide;63|Eu|Europium|9|9|lanthanide;64|Gd|Gadolinium|10|9|lanthanide;65|Tb|Terbium|11|9|lanthanide;66|Dy|Dysprosium|12|9|lanthanide;67|Ho|Holmium|13|9|lanthanide;68|Er|Erbium|14|9|lanthanide;69|Tm|Thulium|15|9|lanthanide;70|Yb|Ytterbium|16|9|lanthanide;71|Lu|Lutetium|17|9|lanthanide;90|Th|Thorium|4|10|actinide;91|Pa|Protactinium|5|10|actinide;92|U|Uranium|6|10|actinide;93|Np|Neptunium|7|10|actinide;94|Pu|Plutonium|8|10|actinide;95|Am|Americium|9|10|actinide;96|Cm|Curium|10|10|actinide;97|Bk|Berkelium|11|10|actinide;98|Cf|Californium|12|10|actinide;99|Es|Einsteinium|13|10|actinide;100|Fm|Fermium|14|10|actinide;101|Md|Mendelevium|15|10|actinide;102|No|Nobelium|16|10|actinide;103|Lr|Lawrencium|17|10|actinide`;
      const elements = elementData.split(";").map((item) => { const [number, symbol, name, group, period, category] = item.split("|"); return { number, symbol, name, group, period, category }; });
      const grid = document.querySelector("#element-grid"); const details = document.querySelector("#details");
      elements.forEach((element) => { const button = document.createElement("button"); button.type = "button"; button.className = `element${element.category === "lanthanide" ? " element--lanthanide" : ""}${element.category === "actinide" ? " element--actinide" : ""}`; button.style.gridColumn = element.group; button.style.gridRow = element.period; button.setAttribute("aria-label", `${element.name}, atomic number ${element.number}, ${element.category}`); button.innerHTML = `<span class="element__number">${element.number}</span><span class="element__symbol">${element.symbol}</span><span class="element__name">${element.name}</span>`; const showDetails = () => { document.querySelectorAll(".is-selected").forEach((selected) => selected.classList.remove("is-selected")); button.classList.add("is-selected"); details.innerHTML = `<p><strong>${element.name} (${element.symbol})</strong> · Atomic number ${element.number} · ${element.category}</p>`; }; button.addEventListener("click", showDetails); button.addEventListener("focus", showDetails); grid.append(button); });
    </script>
  </body>
</html>
